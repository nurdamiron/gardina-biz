name: Diagnose EC2 (docker + nginx routing)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect EC2 via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-03108d97efac1ce59 \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "echo ===IMAGE_AND_CONTAINER_TIME===",
              "docker inspect gardina-backend --format \"container_created={{.Created}} image={{.Config.Image}}\" || true",
              "docker image inspect gardina-stack-backend:new --format \"image_created={{.Created}}\" || true",
              "echo ===IN_CONTAINER_SERVER_JS_MOUNTS===",
              "docker exec gardina-backend sh -c \"grep -nE \\\"api/leads|api/notifications|push/apns\\\" src/server.js\" || true",
              "echo ===IN_CONTAINER_APNS_ROUTE===",
              "docker exec gardina-backend sh -c \"grep -n push/apns src/presentation/http/routes/notification.routes.js\" || echo NO_APNS_ROUTE",
              "echo ===IN_CONTAINER_FUNNEL_ENUM===",
              "docker exec gardina-backend sh -c \"grep -c measurement_scheduled src/application/services/analytics/ClientAnalyticsService.js\" || true",
              "echo ===IN_CONTAINER_DEAL_ENUM===",
              "docker exec gardina-backend sh -c \"grep -n SCHEDULED: src/domain/aggregates/Deal.js\" || true",
              "echo ===DIRECT_LOCALHOST_3002===",
              "echo -n leads: ; curl -s -o /dev/null -w \"%{http_code}\\n\" localhost:3002/api/leads",
              "echo -n apns: ; curl -s -o /dev/null -w \"%{http_code}\\n\" -X POST localhost:3002/api/notifications/push/apns -H \"Content-Type: application/json\" -d \"{}\"",
              "echo ===DONE==="
            ]}' \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $CMD_ID"
          for i in $(seq 1 30); do
            sleep 8
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-03108d97efac1ce59 --query 'Status' --output text 2>/dev/null || echo "InProgress")
            echo "[$i] $STATUS"
            if echo "$STATUS" | grep -qE "^(Success|Failed|TimedOut|Cancelled)$"; then
              echo "================ STDOUT ================"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-03108d97efac1ce59 --query 'StandardOutputContent' --output text
              echo "================ STDERR ================"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-03108d97efac1ce59 --query 'StandardErrorContent' --output text
              [ "$STATUS" = "Success" ] || exit 1
              break
            fi
          done
