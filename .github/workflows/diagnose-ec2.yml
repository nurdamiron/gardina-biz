name: Diagnose EC2 (docker + nginx routing)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect LIVE gardina-backend run config (i-06e2d5837c24c75f3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-06e2d5837c24c75f3 \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "echo ===NETMODE_RESTART_PORTS===",
              "docker inspect gardina-backend --format \"netmode={{.HostConfig.NetworkMode}} restart={{.HostConfig.RestartPolicy.Name}}\"",
              "docker port gardina-backend",
              "echo ===ENV_KEYS_ONLY===",
              "docker inspect gardina-backend --format \"{{range .Config.Env}}{{println .}}{{end}}\" | sed \"s/=.*//\" | sort",
              "echo ===IMAGE===",
              "docker inspect gardina-backend --format \"{{.Config.Image}}\"",
              "echo ===NETWORKS_ON_BOX===",
              "docker network ls",
              "echo ===DONE==="
            ]}' \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $CMD_ID"
          for i in $(seq 1 30); do
            sleep 8
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-06e2d5837c24c75f3 --query 'Status' --output text 2>/dev/null || echo "InProgress")
            echo "[$i] $STATUS"
            if echo "$STATUS" | grep -qE "^(Success|Failed|TimedOut|Cancelled)$"; then
              echo "================ STDOUT ================"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-06e2d5837c24c75f3 --query 'StandardOutputContent' --output text
              echo "================ STDERR ================"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-06e2d5837c24c75f3 --query 'StandardErrorContent' --output text
              [ "$STATUS" = "Success" ] || exit 1
              break
            fi
          done
