name: Diagnose EC2 (docker + nginx routing)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect EC2 via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-03108d97efac1ce59 \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "echo ===PORTS_LISTENING===",
              "ss -tlnp 2>/dev/null | grep -E \":300[0-9]\" || true",
              "echo ===API_GARDINA_NGINX_BLOCK===",
              "docker exec hafiza-nginx sh -c \"nginx -T 2>/dev/null\" | grep -n -A35 \"server_name api.gardina\" | head -80 || true",
              "echo ===THROUGH_NGINX_LOCAL===",
              "echo -n nginx_leads: ; curl -sk -o /dev/null -w \"%{http_code}\\n\" https://localhost/api/leads -H \"Host: api.gardina.alashed.kz\"",
              "echo -n nginx_funnel: ; curl -sk -o /dev/null -w \"%{http_code}\\n\" \"https://localhost/api/analytics/client-funnel?period=month\" -H \"Host: api.gardina.alashed.kz\"",
              "echo ===DIRECT_3002===",
              "echo -n direct_leads: ; curl -s -o /dev/null -w \"%{http_code}\\n\" localhost:3002/api/leads",
              "echo ===WHAT_IS_ON_OTHER_PORTS===",
              "for P in 3001 3003 3004 3005; do echo -n port$P/api/leads: ; curl -s -o /dev/null -w \"%{http_code}\\n\" localhost:$P/api/leads 2>/dev/null || echo down; done",
              "echo ===DONE==="
            ]}' \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $CMD_ID"
          for i in $(seq 1 30); do
            sleep 8
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-03108d97efac1ce59 --query 'Status' --output text 2>/dev/null || echo "InProgress")
            echo "[$i] $STATUS"
            if echo "$STATUS" | grep -qE "^(Success|Failed|TimedOut|Cancelled)$"; then
              echo "================ STDOUT ================"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-03108d97efac1ce59 --query 'StandardOutputContent' --output text
              echo "================ STDERR ================"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-03108d97efac1ce59 --query 'StandardErrorContent' --output text
              [ "$STATUS" = "Success" ] || exit 1
              break
            fi
          done
