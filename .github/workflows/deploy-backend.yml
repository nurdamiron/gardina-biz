name: Deploy Backend → EC2

on:
  push:
    branches: [main]
    paths:
      - 'gardina-backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to EC2 via SSM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Write backend .env
        run: |
          cat > gardina-backend/.env.production << EOF
          NODE_ENV=production
          PORT=3001
          DATABASE_HOST=${{ secrets.DATABASE_HOST }}
          DATABASE_PORT=5432
          DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME=gardina
          DATABASE_SSL=true
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_EXPIRES_IN=7d
          JWT_REFRESH_EXPIRES_IN=30d
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          EOF

      - name: Package backend
        run: |
          tar --warning=no-file-changed -czf /tmp/gardina-backend.tar.gz \
            gardina-backend/src \
            gardina-backend/package.json \
            gardina-backend/package-lock.json \
            gardina-backend/Dockerfile \
            gardina-backend/.env.production

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 cp /tmp/gardina-backend.tar.gz s3://alashed-deploy-temp/gardina-backend-deploy.tar.gz

      - name: Generate presigned URL
        id: presign
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          URL=$(aws s3 presign s3://alashed-deploy-temp/gardina-backend-deploy.tar.gz --expires-in 1800)
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deploy on EC2 via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          PRESIGN_URL="${{ steps.presign.outputs.url }}"

          CMD_ID=$(aws ssm send-command \
            --instance-ids i-03108d97efac1ce59 \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[
              \"set -e\",
              \"rm -rf /tmp/gd-backend && mkdir -p /tmp/gd-backend && cd /tmp/gd-backend\",
              \"wget -q -O backend.tar.gz '${PRESIGN_URL}' && echo DL_OK\",
              \"tar -xzf backend.tar.gz\",
              \"cd gardina-backend && docker build --no-cache --pull -t gardina-stack-backend:new . 2>&1 | tail -8\",
              \"docker stop gardina-backend || true\",
              \"docker rm gardina-backend || true\",
              \"docker run -d --name gardina-backend --restart always --network gardina-stack_gardina-network -p 3002:3001 --env-file /tmp/gd-backend/gardina-backend/.env.production gardina-stack-backend:new\",
              \"docker tag gardina-stack-backend:new gardina-stack-backend:latest\",
              \"docker ps | grep gardina-backend\",
              \"echo DEPLOY_OK\"
            ]}" \
            --query 'Command.CommandId' --output text)

          echo "SSM Command ID: $CMD_ID"

          # Poll until done
          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id i-03108d97efac1ce59 \
              --query 'Status' --output text 2>/dev/null || echo "InProgress")
            echo "[$i] Status: $STATUS"
            if echo "$STATUS" | grep -qE "^(Success|Failed|TimedOut|Cancelled)$"; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id i-03108d97efac1ce59 \
                --query '[StandardOutputContent, StandardErrorContent]' \
                --output text
              [ "$STATUS" = "Success" ] || exit 1
              break
            fi
          done

      - name: Health check
        run: |
          sleep 5
          curl -fsS https://api.gardina.kz/health || echo "Health check skipped (no domain yet)"
