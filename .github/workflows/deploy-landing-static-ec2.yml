# Static marketing site: sourced from gardina-frontend/public (landing.html, styles, images).
name: Deploy landing (static) to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'gardina-frontend/public/**'
      - '.github/workflows/deploy-landing-static-ec2.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Pack public/ and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create archive from gardina-frontend/public
        run: |
          tar --warning=no-file-changed -czf landing-static.tar.gz -C gardina-frontend/public .

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Upload to EC2
        run: |
          scp -i ~/.ssh/ec2-key.pem \
            landing-static.tar.gz \
            ubuntu@${{ secrets.EC2_HOST }}:/tmp/

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/ec2-key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            sudo rm -rf /var/www/gardina.kz.backup 2>/dev/null || true
            sudo cp -r /var/www/gardina.kz /var/www/gardina.kz.backup 2>/dev/null || true
            cd /tmp
            mkdir -p landing-extract
            tar -xzf landing-static.tar.gz -C landing-extract
            sudo mkdir -p /var/www/gardina.kz
            sudo rm -rf /var/www/gardina.kz/*
            sudo cp -r landing-extract/* /var/www/gardina.kz/
            rm -rf /tmp/landing-static.tar.gz /tmp/landing-extract
          ENDSSH

      - name: Health check
        run: sleep 3 && curl -f https://gardina.kz || exit 1
