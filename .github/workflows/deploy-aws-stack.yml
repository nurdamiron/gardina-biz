name: Deploy full AWS stack (EC2 + Docker Compose)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-aws-stack.yml'
      - 'docker-compose.yml'
      - 'nginx/**'
      - 'gardina-frontend/**'
      - 'gardina-backend/**'
      - 'gardina-bot/**'
      - 'deploy.sh'
      - 'scripts/deploy-aws-stack.sh'
  workflow_dispatch:

jobs:
  deploy:
    name: Build and restart stack on EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive stack sources
        run: |
          tar --warning=no-file-changed -czf gardina-stack.tar.gz \
            docker-compose.yml \
            deploy.sh \
            nginx \
            gardina-frontend \
            gardina-backend \
            gardina-bot \
            scripts/deploy-aws-stack.sh

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload bundle to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/ec2-key.pem gardina-stack.tar.gz ubuntu@"$EC2_HOST":/tmp/

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/ec2-key.pem ubuntu@"$EC2_HOST" << 'ENDSSH'
            set -e
            STACK_DIR=/opt/gardina-stack
            sudo mkdir -p "$STACK_DIR"
            sudo chown -R ubuntu:ubuntu "$STACK_DIR"
            cd "$STACK_DIR"
            tar -xzf /tmp/gardina-stack.tar.gz
            rm -f /tmp/gardina-stack.tar.gz
            chmod +x scripts/deploy-aws-stack.sh
            ./scripts/deploy-aws-stack.sh
          ENDSSH

      - name: Health check
        run: |
          sleep 8
          curl -fsS https://gardina.kz >/dev/null
          curl -fsS https://app.gardina.kz >/dev/null
          curl -fsS https://api.gardina.kz/health >/dev/null
