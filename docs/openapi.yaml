    ServiceRateInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        serviceType: { type: string }
        calcMethod: { type: string, enum: [per_meter, per_piece, fixed] }
        baseRate: { type: number, format: float }
