    post:
      tags: [Notifications]
      summary: Register a native iOS APNs device token
      description: >
        Stores the iOS device token in push_subscriptions (platform=ios). Idempotent
        per (user, token). Used by the native iOS client; Web Push clients use
        /notifications/push/subscribe instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceToken]
              properties:
                deviceToken:
                  type: string
                  description: APNs device token (hex string)
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }

