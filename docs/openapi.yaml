        measurementId: { type: string, format: uuid }
        proposalId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DealStatus' }
        totalAmount: { type: number, format: float }
        prepaymentPercent: { type: number, format: float }
        deadline: { type: string, format: date }
        designerCommissionPercent: { type: number, format: float }
    DealResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          allOf:
            - $ref: '#/components/schemas/Deal'
            - type: object
              properties:
                events:
                  type: array
                  items: { $ref: '#/components/schemas/DealEvent' }

    DealEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        dealId: { type: string, format: uuid }
        eventType: { type: string }
        description: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    Proposal:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        measurementId: { type: string, format: uuid, nullable: true }
        clientId: { type: string, format: uuid }
        designerId: { type: string, format: uuid }
        variantName: { type: string, nullable: true }
        fabricId: { type: string, format: uuid, nullable: true }
        fabricMeters: { type: number, format: float, nullable: true }
        fabricCost: { type: number, format: float, nullable: true }
        curtainId: { type: string, format: uuid, nullable: true }
        curtainCost: { type: number, format: float, nullable: true }
        sewingCost: { type: number, format: float, nullable: true }
        installationCost: { type: number, format: float, nullable: true }
        additionalCosts:
          type: array
          items: { type: object, additionalProperties: true }
        discountPercent: { type: number, format: float, default: 0 }
        totalCost: { type: number, format: float }
        status: { $ref: '#/components/schemas/ProposalStatus' }
        sentAt: { type: string, format: date-time, nullable: true }
        viewedAt: { type: string, format: date-time, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        pdfUrl: { type: string, format: uri, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProposalInput:
      type: object
      required: [clientId, totalCost]
      properties:
        measurementId: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        designerId: { type: string, format: uuid }
        variantName: { type: string }
        fabricId: { type: string, format: uuid }
        fabricMeters: { type: number, format: float }
        fabricCost: { type: number, format: float }
        curtainId: { type: string, format: uuid }
        curtainCost: { type: number, format: float }
        sewingCost: { type: number, format: float }
        installationCost: { type: number, format: float }
        additionalCosts:
          type: array
          items: { type: object, additionalProperties: true }
        discountPercent: { type: number, format: float }
        totalCost: { type: number, format: float }
        status: { $ref: '#/components/schemas/ProposalStatus' }
        notes: { type: string }

    Fabric:
      description: >-
        Catalog product. Backed by the `products` table (type fabric/curtain/
        accessory/service). Historically called "fabric"; routes are /catalog/products.
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        type: { type: string, enum: [fabric, curtain, accessory, service] }
        category: { type: string, nullable: true }
        pricePerMeter: { type: number, format: float, nullable: true }
        costPrice: { type: number, format: float, nullable: true }
        widthCm: { type: integer, default: 280 }
        brand: { type: string, nullable: true }
        supplier: { type: string, nullable: true }
        description: { type: string, nullable: true }
        imageUrl: { type: string, format: uri, nullable: true }
        stockQuantity: { type: number, format: float, default: 0 }
        unit: { type: string, enum: [meter, piece, set, item], default: meter }
        isAvailable: { type: boolean, default: true }
        properties: { type: object, additionalProperties: true }
        variants:
          type: array
          items: { $ref: '#/components/schemas/ProductVariant' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FabricInput:
      type: object
      required: [name, code, type]
      properties:
        name: { type: string }
        code: { type: string }
        type: { type: string, enum: [fabric, curtain, accessory, service] }
        category: { type: string }
        pricePerMeter: { type: number, format: float }
        costPrice: { type: number, format: float }
        widthCm: { type: integer }
        brand: { type: string }
        supplier: { type: string }
        description: { type: string }
        imageUrl: { type: string, format: uri }
        stockQuantity: { type: number, format: float }
        unit: { type: string, enum: [meter, piece, set, item] }
        isAvailable: { type: boolean }
        properties: { type: object, additionalProperties: true }

    ProductVariant:
