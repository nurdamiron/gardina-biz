    post:
      tags: [Notifications]
      summary: Create a notification (admin/system)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, type, title]
              properties:
                userId: { type: string, format: uuid }
                type: { $ref: '#/components/schemas/NotificationType' }
