  /leads:
    post:
      tags: [Leads]
      summary: Submit a landing-page lead (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name: { type: string }
                phone: { type: string }
                salon: { type: string }
                comment: { type: string }
      responses:
        '201':
          description: Lead captured
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Lead' }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Leads]
      summary: List leads (admin)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Lead list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Lead' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /leads/{id}/status:
    patch:
      tags: [Leads]
      summary: Update a lead's status (admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, example: contacted }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Lead' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──────────────────────────────────────────── UPLOAD ───────────────────────
  /upload/photo:
    post:
      tags: [Upload]
      summary: Upload a single photo
      description: >-
        multipart/form-data. Field name `photo`. Max 10MB, magic-byte validated,
        jpeg/png/webp/gif only. Stored in S3.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      url: { type: string, format: uri }
                      thumbnailUrl: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /upload/photos:
    post:
      tags: [Upload]
      summary: Upload multiple photos (max 10)
      description: multipart/form-data. Field name `photos` (array). Each file max 10MB, jpeg/png/webp/gif.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  items: { type: string, format: binary }
                  maxItems: 10
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        url: { type: string, format: uri }
                        thumbnailUrl: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

# ════════════════════════════════════════════ COMPONENTS ═════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WindowId:
      name: windowId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteToken:
      name: token
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Period:
      name: period
      in: query
      description: Time window for the analytics query.
      schema:
        type: string
        enum: [today, week, month, quarter, year, all]

  responses:
    Success:
      description: Operation succeeded
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              message: { type: string }
    AnalyticsObject:
      description: Analytics result (object payload)
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              data: { type: object, additionalProperties: true }
    AnalyticsArray:
      description: Analytics result (array payload)
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              data:
                type: array
                items: { type: object, additionalProperties: true }
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but role not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found (or not in caller's tenant)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ReadOnly:
      description: Subscription read-only mode — writes blocked
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  code:
                    type: string
                    const: SUBSCRIPTION_READ_ONLY

  schemas:
    # ── Common ──────────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        message: { type: string }
        code: { type: string }
        timestamp: { type: string, format: date-time }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    # ── Enums ───────────────────────────────────────────────────────────────
    UserRole:
      type: string
      enum: [designer, manager, production, installer, admin, sales]
    DealStatus:
      type: string
      enum:
        - lead
        - measurement_scheduled
        - measurement_done
        - proposal_sent
        - proposal_accepted
        - contract_signed
        - in_production
        - ready_for_installation
        - installation_scheduled
        - installed
        - completed
        - cancelled
    OrderStatus:
      type: string
      enum: [pending, cutting, sewing, quality_check, ready, shipped]
    MeasurementStatus:
      type: string
      enum: [scheduled, in_progress, completed, cancelled]
    ProposalStatus:
      type: string
      enum: [draft, sent, viewed, accepted, rejected]
    PaymentStatus:
      type: string
      enum: [pending, partial, paid, refunded]
    InstallationStatus:
      type: string
      enum: [scheduled, in_progress, completed, rescheduled, cancelled]
    FabricType:
      type: string
      enum: [transparent, semi_blackout, blackout, decorative]
    MountingType:
      type: string
      enum: [wall, ceiling, frame, niche]
    NotificationType:
      type: string
      enum: [urgent, warning, info]
    PhotoType:
      type: string
      enum: [room, window, upper_zone, obstacle, fabric_sample, after_installation, other]
    SubscriptionStatus:
      type: string
      enum: [active, trial, past_due, pending_payment, canceled]

    # ── Auth ────────────────────────────────────────────────────────────────
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    AuthResult:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
            tokens: { $ref: '#/components/schemas/TokenPair' }

    # ── Core entities ─────────────────────────────────────────────────────────
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        currentPlanCode: { type: string, enum: [start, pro, network], nullable: true }
        billingCycle: { type: string, enum: [monthly, yearly] }
        subscriptionStatus: { $ref: '#/components/schemas/SubscriptionStatus' }
        trialStartedAt: { type: string, format: date-time, nullable: true }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        readOnlySince: { type: string, format: date-time, nullable: true }
        maxUsersOverride: { type: integer, nullable: true }
        maxSalonsOverride: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        avatarUrl: { type: string, format: uri, nullable: true }
        isActive: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Client:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        whatsapp: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        address: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        source: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClientInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string }
        phone: { type: string }
        whatsapp: { type: string }
        email: { type: string, format: email }
        address: { type: string }
        notes: { type: string }
        source: { type: string }
        tags:
          type: array
          items: { type: string }

    Measurement:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        designerId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/MeasurementStatus' }
        scheduledAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        address: { type: string }
        roomType: { type: string, nullable: true }
        budgetMin: { type: number, format: float, nullable: true }
        budgetMax: { type: number, format: float, nullable: true }
        deadline: { type: string, format: date, nullable: true }
        clientReaction: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        deliveryCost: { type: number, format: float, nullable: true, description: Added by auto-migration }
        mapLink: { type: string, nullable: true }
        priority: { type: string, nullable: true, default: standard }
        styles: { type: string, nullable: true }
        curtainTypes: { type: string, nullable: true }
        technicalFeatures:
          type: array
          items: { type: string }
        windows:
          type: array
          items: { $ref: '#/components/schemas/MeasurementWindow' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MeasurementInput:
      type: object
      required: [clientId, address]
      properties:
        clientId: { type: string, format: uuid }
        designerId: { type: string, format: uuid }
        address: { type: string }
        scheduledAt: { type: string, format: date-time }
        roomType: { type: string }
        budgetMin: { type: number, format: float }
        budgetMax: { type: number, format: float }
        deadline: { type: string, format: date }
        notes: { type: string }
        deliveryCost: { type: number, format: float }
        mapLink: { type: string }
        priority: { type: string }
        styles: { type: string }
        curtainTypes: { type: string }
        technicalFeatures:
          type: array
          items: { type: string }

    MeasurementWindow:
      type: object
      properties:
        id: { type: string, format: uuid }
        measurementId: { type: string, format: uuid }
        windowNumber: { type: integer }
        roomName: { type: string, nullable: true }
        widthLeft: { type: integer, nullable: true, description: mm }
        widthCenter: { type: integer, nullable: true, description: mm }
        widthRight: { type: integer, nullable: true, description: mm }
        heightLeft: { type: integer, nullable: true, description: mm }
        heightCenter: { type: integer, nullable: true, description: mm }
        heightRight: { type: integer, nullable: true, description: mm }
        mountingType: { $ref: '#/components/schemas/MountingType' }
        topOffset: { type: integer, nullable: true }
        sillHeight: { type: integer, nullable: true }
        obstacles:
          type: array
          items: { type: object, additionalProperties: true }
        fabricCode: { type: string, nullable: true, description: Added by auto-migration }
        fabricBrand: { type: string, nullable: true }
        designPhotos:
          type: array
          items: { type: string, format: uri }
        priceBreakdown: { type: object, additionalProperties: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MeasurementWindowInput:
      type: object
      properties:
        windowNumber: { type: integer }
        roomName: { type: string }
        widthLeft: { type: integer }
        widthCenter: { type: integer }
        widthRight: { type: integer }
        heightLeft: { type: integer }
        heightCenter: { type: integer }
        heightRight: { type: integer }
        mountingType: { $ref: '#/components/schemas/MountingType' }
        topOffset: { type: integer }
        sillHeight: { type: integer }
        obstacles:
          type: array
          items: { type: object, additionalProperties: true }
        fabricCode: { type: string }
        fabricBrand: { type: string }
        designPhotos:
          type: array
          items: { type: string, format: uri }
        notes: { type: string }

    Photo:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        measurementId: { type: string, format: uuid, nullable: true }
        windowId: { type: string, format: uuid, nullable: true }
        dealId: { type: string, format: uuid, nullable: true }
        photoType: { $ref: '#/components/schemas/PhotoType' }
        url: { type: string, format: uri }
        thumbnailUrl: { type: string, format: uri, nullable: true }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Deal:
      type: object
      properties:
        id: { type: string, format: uuid }
