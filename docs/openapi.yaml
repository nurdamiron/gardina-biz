openapi: 3.1.0
info:
  title: Gardina API
  version: 1.0.0
  description: >-
    Multi-tenant SaaS ERP for curtain/drapery salons. Single source of truth for
    the web and iOS clients. All resource routes are tenant-scoped via the JWT
    (the token carries `organizationId`); clients never pass tenant ids explicitly.


    AUTH: JWT Bearer. Access token ~7d, refresh token ~30d, bcrypt passwords.


    READ-ONLY MODE: when the organization's subscription is expired/past_due/canceled,
    write operations return 402 with `code: SUBSCRIPTION_READ_ONLY`. The `/auth` and
    `/billing` route groups are whitelisted.


    RATE LIMITS: global 100 req / 15 min per IP on `/api`. Stricter per-route limits:
    login 5/15min, password-reset 5/15min, register-salon & register 3/h, refresh 30/15min.


    RESPONSE ENVELOPE: most endpoints return `{ success: true, data: ... }`. Errors
    return `{ success: false, error: "..."}` or `{ error, message, timestamp }` from
    the global handler. Shapes vary by controller; this contract documents the common
    cases.
servers:
  - url: https://api.gardina.kz/api
    description: Production
  - url: http://localhost:5000/api
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Deals
  - name: Orders
  - name: Clients
  - name: Measurements
  - name: Proposals
  - name: Users
  - name: Catalog
  - name: Analytics
  - name: Payments
  - name: Notifications
  - name: Installations
  - name: Billing
  - name: Audit
  - name: Onboarding
  - name: Leads
  - name: Upload
  - name: Health

paths:
  # ──────────────────────────────────────────── HEALTH ───────────────────────
  /health:
    get:
      tags: [Health]
      summary: Liveness + DB connectivity check
      description: >-
        Mounted at the server root (NOT under /api). Returns 200 when the DB
        responds, 503 otherwise. There are no `/ready` or `/version` endpoints in
        the current backend.
      security: []
      servers:
        - url: https://api.gardina.kz
        - url: http://localhost:5000
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: healthy }
                  database: { type: string, example: connected }
                  timestamp: { type: string, format: date-time }
        '503':
          description: Unhealthy (DB disconnected)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: unhealthy }
                  database: { type: string, example: disconnected }
                  error: { type: string }
                  timestamp: { type: string, format: date-time }

  # ──────────────────────────────────────────── AUTH ─────────────────────────
  /auth/register-salon:
    post:
      tags: [Auth]
      summary: Register a new salon (tenant + admin user)
      description: Public SaaS signup. Creates an organization and its first admin. Rate limit 3/hour/IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationName, name, phone, password]
              properties:
                organizationName: { type: string }
                slug: { type: string, description: Optional; auto-generated from name if omitted }
                name: { type: string, description: Admin full name }
                email: { type: string, format: email }
                phone: { type: string }
                password: { type: string, format: password, minLength: 6 }
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a user (disabled unless ALLOW_PUBLIC_REGISTRATION=true)
      description: Returns 403 in production by default. Rate limit 3/hour/IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                password: { type: string, format: password }
                role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Login by phone or email. Rate limit 5/15min/IP (successful logins not counted).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, description: Phone or email }
                password: { type: string, format: password }
                organizationSlug: { type: string, description: Optional tenant disambiguation }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for new tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      tokens: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Auth]
      summary: Delete the current user's account (self-service)
      description: >
        App Store Guideline 5.1.1(v) account-deletion path. Requires password
        re-confirmation. Performs GDPR-style erasure (personal data stripped,
        account deactivated and can no longer log in); organization business
        records that reference the user are preserved. Returns 409 `LAST_ADMIN`
        if the caller is the only active admin of the organization. Whitelisted
        from the read-only billing gate, so it works on an expired subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  description: Current password, for confirmation
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Caller is the last active admin (code LAST_ADMIN)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  code: { type: string, example: LAST_ADMIN }
                  error: { type: string }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (blacklists the access token in-memory)
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Request a password-reset email
      description: Rate limit 5/15min/IP. Always returns success to avoid account enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login: { type: string, description: Phone or email }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Confirm a password reset with the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 6 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/check-slug:
    get:
      tags: [Auth]
      summary: Check organization slug availability
      security: []
      parameters:
        - name: slug
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  available: { type: boolean }
                  slug: { type: string }
                  reason: { type: string, example: too_short }

  /auth/verify-email:
    get:
      tags: [Auth]
      summary: Verify an email address via emailed token
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend the email-verification message (authenticated)
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/invite/{token}:
    get:
      tags: [Auth]
      summary: Get invite details by token
      security: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: Invite details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      email: { type: string, format: email }
                      role: { $ref: '#/components/schemas/UserRole' }
                      organizationName: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/invite/{token}/accept:
    post:
      tags: [Auth]
      summary: Accept an invite and create the account
      security: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string }
                phone: { type: string }
                password: { type: string, format: password, minLength: 6 }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──────────────────────────────────────────── DEALS ────────────────────────
  /deals/funnel:
    get:
      tags: [Deals]
      summary: Deal funnel counts/amounts by status
      responses:
        '200':
          description: Funnel breakdown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunnelResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /deals:
    get:
      tags: [Deals]
      summary: List deals
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DealStatus' }
        - name: designerId
          in: query
          schema: { type: string, format: uuid }
        - name: clientId
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Deal list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Deal' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Deals]
      summary: Create a deal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/ReadOnly' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /deals/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Deals]
      summary: Get a deal by id (with events/timeline)
      responses:
        '200':
          description: Deal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Deals]
      summary: Delete a deal
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '402': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /deals/{id}/status:
    patch:
      tags: [Deals]
      summary: Update deal status
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/DealStatus' }
                note: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deals/{id}/payment:
    patch:
      tags: [Deals]
      summary: Record a payment against a deal
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, format: float }
                type:
                  type: string
                  enum: [prepayment, final_payment]
                paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──────────────────────────────────────────── ORDERS ───────────────────────
  # NOTE: /orders mirrors /deals exactly (frontend aliases ordersAPI as dealsAPI).
  /orders/funnel:
    get:
      tags: [Orders]
      summary: Order funnel counts/amounts by status
      responses:
        '200':
          description: Funnel breakdown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunnelResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders:
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DealStatus' }
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Deal' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Orders]
      summary: Create an order (deal)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/ReadOnly' }

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Orders]
      summary: Get an order by id
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Orders]
      summary: Delete an order
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '402': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/DealStatus' }
                note: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealResponse' }
        '402': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/payment:
    patch:
      tags: [Orders]
      summary: Record a payment against an order
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, format: float }
                type: { type: string, enum: [prepayment, final_payment] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealResponse' }
        '402': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──────────────────────────────────────────── CLIENTS ──────────────────────
  /clients:
    get:
      tags: [Clients]
      summary: List clients
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Client list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Client' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/ReadOnly' }

  /clients/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Clients]
      summary: Get a client by id
      responses:
        '200':
          description: Client
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Client' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Clients]
      summary: Update a client
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Client' }
        '402': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Clients]
      summary: Delete a client
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '402': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────── MEASUREMENTS ───────────────────
  /measurements:
    get:
      tags: [Measurements]
      summary: List measurements
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/MeasurementStatus' }
        - name: designerId
          in: query
          schema: { type: string, format: uuid }
        - name: clientId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Measurement list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Measurement' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Measurements]
      summary: Create a measurement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeasurementInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Measurement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/ReadOnly' }

  /measurements/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Measurements]
      summary: Get a measurement (with windows)
      responses:
        '200':
          description: Measurement
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Measurement' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Measurements]
      summary: Update a measurement (and its windows)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MeasurementInput'
                - type: object
                  properties:
                    windows:
                      type: array
                      items: { $ref: '#/components/schemas/MeasurementWindowInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Measurement' }
        '402': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }

  /measurements/{id}/complete:
    patch:
      tags: [Measurements]
      summary: Mark a measurement as completed
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Completed
          content:
