<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1b5e45" />
    <meta name="description" content="Gardina — перде салондары мен ательелерге арналған жүйе: клиенттер, өлшем, ұсыныс, өндіріс және төлем бір жерде." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gardina" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Gardina — перде бизнесі үшін жүйе</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons: Hugeicons (via @hugeicons/react package) -->
    <!-- Tailwind is built locally via @tailwindcss/vite plugin (see src/index.css). -->

    <style>
      /* PWA Safe Areas Support */
      :root {
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-left: env(safe-area-inset-left, 0px);
        --safe-area-right: env(safe-area-inset-right, 0px);
      }

      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      /* PWA Mode - Add padding for notch/home indicator */
      @media (display-mode: standalone) {
        #root {
          padding-top: env(safe-area-inset-top);
        }

        /* Sticky headers in PWA mode should account for notch */
        .sticky {
          top: env(safe-area-inset-top) !important;
        }
      }

      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }

      .material-symbols-outlined.filled {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Safe area utilities */
      .pb-safe {
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }

      .pt-safe {
        padding-top: max(20px, env(safe-area-inset-top));
      }

      .px-safe {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }

      /* PWA install prompt positioning */
      @media (display-mode: standalone) {
        .pwa-install-prompt {
          bottom: calc(96px + env(safe-area-inset-bottom)) !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
