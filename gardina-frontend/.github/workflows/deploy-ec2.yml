name: Deploy Frontend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy to Production EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          VITE_API_URL: https://api.gardina.kz/api
          VITE_AWS_S3_ROUTE: https://alashed-media.s3.eu-north-1.amazonaws.com/gardina

      - name: Create deployment archive
        run: tar -czf gardina-frontend.tar.gz dist

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Upload to EC2
        run: |
          scp -i ~/.ssh/ec2-key.pem \
              gardina-frontend.tar.gz \
              ubuntu@${{ secrets.EC2_HOST }}:/tmp/

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/ec2-key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e

            echo "📂 Backing up old version..."
            sudo rm -rf /var/www/app.gardina.kz.backup 2>/dev/null || true
            sudo cp -r /var/www/app.gardina.kz /var/www/app.gardina.kz.backup 2>/dev/null || true

            echo "📦 Extracting new build..."
            cd /tmp
            tar -xzf gardina-frontend.tar.gz

            echo "🚀 Deploying to production..."
            sudo rm -rf /var/www/app.gardina.kz/*
            sudo cp -r dist/* /var/www/app.gardina.kz/

            echo "🧹 Cleanup..."
            rm -rf /tmp/gardina-frontend.tar.gz /tmp/dist

            echo "🎉 Deployment complete!"
          ENDSSH

      - name: Health Check
        run: |
          sleep 3
          curl -f https://app.gardina.kz || exit 1

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Frontend deployment successful!"
          echo "🌐 App: https://app.gardina.kz"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
