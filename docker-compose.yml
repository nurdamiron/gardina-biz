version: '3.8'

services:
  # ============================================
  # NGINX REVERSE PROXY
  # Handles routing for all domains
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: gardina-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./gardina-frontend/public:/var/www/landing:ro
    depends_on:
      - backend
      - frontend
    networks:
      - gardina-network

  # ============================================
  # CERTBOT - SSL Certificate Management
  # ============================================
  # certbot's --deploy-hook only runs inside the certbot container,
  # which has no docker socket access, so it writes a timestamp to a
  # shared volume. The nginx-reloader sidecar watches that volume and
  # runs `nginx -s reload` whenever it changes. Without this, nginx
  # serves the old cert until the next manual restart and clients see
  # NET::ERR_CERT_DATE_INVALID after expiry.
  certbot:
    image: certbot/certbot
    container_name: gardina-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - certbot-reload:/var/lib/letsencrypt-reload
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --deploy-hook \"date -u +%FT%TZ > /var/lib/letsencrypt-reload/trigger\"; sleep 12h & wait $${!}; done;'"
    networks:
      - gardina-network

  nginx-reloader:
    image: docker:cli
    container_name: gardina-nginx-reloader
    restart: always
    depends_on:
      - certbot
      - nginx
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - certbot-reload:/var/lib/letsencrypt-reload
    entrypoint: "/bin/sh -c 'touch /var/lib/letsencrypt-reload/trigger; last=$$(stat -c %Y /var/lib/letsencrypt-reload/trigger 2>/dev/null || echo 0); while sleep 60; do current=$$(stat -c %Y /var/lib/letsencrypt-reload/trigger 2>/dev/null || echo 0); if [ \"$$current\" != \"$$last\" ]; then echo \"[nginx-reloader] cert renewed, reloading nginx\"; docker exec gardina-nginx nginx -s reload || true; last=$$current; fi; done'"
    networks:
      - gardina-network

  # ============================================
  # BACKEND API - api.gardina.kz
  # ============================================
  backend:
    build:
      context: ./gardina-backend
      dockerfile: Dockerfile
    container_name: gardina-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - ./gardina-backend/.env.production
    expose:
      - "3001"
    networks:
      - gardina-network

  # ============================================
  # FRONTEND APP - app.gardina.kz
  # ============================================
  frontend:
    build:
      context: ./gardina-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api.gardina.kz/api
    container_name: gardina-frontend
    restart: always
    expose:
      - "80"
    networks:
      - gardina-network

  # ============================================
  # TELEGRAM BOT - Gardina Academy
  # ============================================
  telegram-bot:
    build: ./gardina-bot
    container_name: gardina-telegram-bot
    restart: always
    env_file:
      - ./gardina-bot/.env
    networks:
      - gardina-network

networks:
  gardina-network:
    driver: bridge

volumes:
  certbot-reload:
