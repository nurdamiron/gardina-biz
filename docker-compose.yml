version: '3.8'

services:
  # ============================================
  # NGINX REVERSE PROXY
  # Handles routing for all domains
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: gardina-nginx
    restart: always
    # Defaults publish on the host's 80/443. On a shared box where another web
    # server (e.g. cPanel Apache/LiteSpeed) already owns those ports, set
    # NGINX_HTTP_BIND / NGINX_HTTPS_BIND in ./.env to a loopback high port
    # (e.g. 127.0.0.1:8080) and reverse-proxy the gardina.kz hostnames to it
    # from the existing edge server. See docs/MIGRATION-gardina.kz.md.
    ports:
      - "${NGINX_HTTP_BIND:-80}:80"
      - "${NGINX_HTTPS_BIND:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./gardina-frontend/public:/var/www/landing:ro
    depends_on:
      - backend
      - frontend
    networks:
      - gardina-network

  # ============================================
  # CERTBOT - SSL Certificate Management
  # ============================================
  # certbot's --deploy-hook only runs inside the certbot container,
  # which has no docker socket access, so it writes a timestamp to a
  # shared volume. The nginx-reloader sidecar watches that volume and
  # runs `nginx -s reload` whenever it changes. Without this, nginx
  # serves the old cert until the next manual restart and clients see
  # NET::ERR_CERT_DATE_INVALID after expiry.
  certbot:
    image: certbot/certbot
    container_name: gardina-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - certbot-reload:/var/lib/letsencrypt-reload
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --deploy-hook \"date -u +%FT%TZ > /var/lib/letsencrypt-reload/trigger\"; sleep 12h & wait $${!}; done;'"
    networks:
      - gardina-network

  nginx-reloader:
    image: docker:cli
    container_name: gardina-nginx-reloader
    restart: always
    depends_on:
      - certbot
      - nginx
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - certbot-reload:/var/lib/letsencrypt-reload
    entrypoint: "/bin/sh -c 'touch /var/lib/letsencrypt-reload/trigger; last=$$(stat -c %Y /var/lib/letsencrypt-reload/trigger 2>/dev/null || echo 0); while sleep 60; do current=$$(stat -c %Y /var/lib/letsencrypt-reload/trigger 2>/dev/null || echo 0); if [ \"$$current\" != \"$$last\" ]; then echo \"[nginx-reloader] cert renewed, reloading nginx\"; docker exec gardina-nginx nginx -s reload || true; last=$$current; fi; done'"
    networks:
      - gardina-network

  # ============================================
  # POSTGRESQL - primary datastore (backend + bot)
  # ============================================
  # Migrated onto this host (pg_dump/pg_restore). To keep using an external
  # managed DB instead, comment this service out and point DB_HOST at it.
  postgres:
    image: postgres:16-alpine
    container_name: gardina-postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-gardina_shtory}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ./.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gardina_shtory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gardina-network

  # ============================================
  # BACKEND API - api.gardina.kz
  # ============================================
  backend:
    build:
      context: ./gardina-backend
      dockerfile: Dockerfile
    container_name: gardina-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - ./gardina-backend/.env.production
    volumes:
      # Home for locally-stored uploads when UPLOAD_DRIVER=local (see runbook).
      - gardina-uploads:/app/uploads
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gardina-network

  # ============================================
  # FRONTEND APP - app.gardina.kz
  # ============================================
  frontend:
    build:
      context: ./gardina-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api.gardina.kz/api
    container_name: gardina-frontend
    restart: always
    expose:
      - "80"
    networks:
      - gardina-network

  # ============================================
  # TELEGRAM BOT - Gardina Academy
  # ============================================
  telegram-bot:
    build: ./gardina-bot
    container_name: gardina-telegram-bot
    restart: always
    env_file:
      - ./gardina-bot/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gardina-network

networks:
  gardina-network:
    driver: bridge

volumes:
  certbot-reload:
  postgres-data:
  gardina-uploads:
