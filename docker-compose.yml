# ============================================
# GARDINA — isolated from other projects on the same host
# ============================================
# This box already runs a shared Caddy reverse proxy (another project's
# docker-compose, ports 80/443) fronting other sites. Gardina does NOT run
# its own nginx/certbot here — there's only one public IP, so a second
# process can't bind 80/443, and running one would fight the shared Caddy's
# own ACME challenges on those same ports.
#
# Isolation model (same pattern already used for the other apps on this
# Caddy): every Gardina service — postgres, backend, frontend, bot — lives
# on its own private `gardina-network`, own volumes, own containers. Nothing
# here shares a database, a volume, or a filesystem with another project.
# The ONLY coupling to the shared host is that `backend` and `frontend` also
# join the pre-existing external network the shared Caddy runs on (set via
# CADDY_NETWORK in ./.env), purely so Caddy's reverse_proxy can resolve
# gardina-backend / gardina-frontend by container name. Caddy itself is
# configured with a few lines in the shared Caddyfile — see
# docs/MIGRATION-gardina.kz.md.
#
# The static landing page (gardina.kz / www.gardina.kz) needs no container at
# all: it's served by the shared Caddy directly via file_server from
# gardina-frontend/public, bind-mounted read-only into the Caddy container.

services:
  # ============================================
  # POSTGRESQL - primary datastore (backend + bot)
  # ============================================
  # Own container, own volume, own network — not shared with any other
  # project's database. To use an external managed DB instead, comment this
  # out and point DB_HOST at it in gardina-backend/.env.production.
  postgres:
    image: postgres:16-alpine
    container_name: gardina-postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-gardina_shtory}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ./.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gardina_shtory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gardina-network

  # ============================================
  # BACKEND API - api.gardina.kz
  # ============================================
  backend:
    build:
      context: ./gardina-backend
      dockerfile: Dockerfile
    container_name: gardina-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - ./gardina-backend/.env.production
    volumes:
      # UPLOAD_DRIVER=local (default, no AWS account needed) writes here.
      - gardina-uploads:/app/uploads
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gardina-network
      - caddy-edge # so the shared Caddy can reverse_proxy to gardina-backend:3001

  # ============================================
  # FRONTEND APP - app.gardina.kz
  # ============================================
  frontend:
    build:
      context: ./gardina-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api.gardina.kz/api
    container_name: gardina-frontend
    restart: always
    expose:
      - "80"
    networks:
      - gardina-network
      - caddy-edge # so the shared Caddy can reverse_proxy to gardina-frontend:80

  # ============================================
  # TELEGRAM BOT - Gardina Academy
  # ============================================
  telegram-bot:
    build: ./gardina-bot
    container_name: gardina-telegram-bot
    restart: always
    env_file:
      - ./gardina-bot/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gardina-network

networks:
  # Private to Gardina — postgres and the bot are never reachable from it.
  gardina-network:
    driver: bridge
  # The shared host's existing reverse-proxy network. Must already exist
  # (created by the other project's docker-compose) — set its real name in
  # ./.env if it isn't called myshop_default. `external: true` means compose
  # never creates or deletes it, only joins backend/frontend to it.
  caddy-edge:
    name: ${CADDY_NETWORK:-myshop_default}
    external: true

volumes:
  postgres-data:
  gardina-uploads:
