version: '3.8'

services:
  # ============================================
  # NGINX REVERSE PROXY
  # Handles routing for all domains
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: gardina-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./gardina-frontend/public:/var/www/landing:ro
    depends_on:
      - backend
      - frontend
    networks:
      - gardina-network

  # ============================================
  # CERTBOT - SSL Certificate Management
  # ============================================
  certbot:
    image: certbot/certbot
    container_name: gardina-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - gardina-network

  # ============================================
  # BACKEND API - api.gardina.kz
  # ============================================
  backend:
    build:
      context: ./gardina-backend
      dockerfile: Dockerfile
    container_name: gardina-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - ./gardina-backend/.env.production
    expose:
      - "3001"
    networks:
      - gardina-network

  # ============================================
  # FRONTEND APP - app.gardina.kz
  # ============================================
  frontend:
    build:
      context: ./gardina-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api.gardina.kz/api
    container_name: gardina-frontend
    restart: always
    expose:
      - "80"
    networks:
      - gardina-network

  # ============================================
  # TELEGRAM BOT - Gardina Academy
  # ============================================
  telegram-bot:
    build: ./gardina-bot
    container_name: gardina-telegram-bot
    restart: always
    env_file:
      - ./gardina-bot/.env
    networks:
      - gardina-network

networks:
  gardina-network:
    driver: bridge
